<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Quiz Scoreboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="menuBtn">☰</button>
<button id="fullscreenBtn">⛶</button>

<!-- SIDEBAR (TEACHER / MOBILE CONTROLLER) -->
<aside id="sidebar">
    <h2>Teacher Panel</h2>

    <label>Round Name</label>
    <input id="roundInput" placeholder="e.g. Science">

    <label>Number of Teams</label>
    <select id="teamCount">
        <option>2</option><option>3</option>
        <option selected>4</option>
        <option>5</option><option>6</option>
        <option>7</option><option>8</option>
    </select>

    <div id="teamNames"></div>

    <hr>

    <h3>🎰 Gambling Round</h3>
    <input type="number" id="gambleAmount" placeholder="20 / 40 / 60">
    <div class="row">
        <button onclick="gamble(true)">Win</button>
        <button onclick="gamble(false)">Lose</button>
    </div>

    <hr>

    <button class="danger" onclick="resetAll()">Reset Game</button>
</aside>

<!-- MAIN DISPLAY -->
<main class="app">
    <h1>Smart Quiz Scoreboard</h1>
    <h2 id="roundTitle">Round: -</h2>

    <div class="timer">
    <div class="timer-display">
        <span id="time">30</span><small>s</small>
    </div>
    <div class="timer-btns">
        <button onclick="toggleTimer()" id="playPauseBtn" class="icon-btn">
            <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg id="pauseIcon" style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
        
        <button onclick="resetTimer()" class="icon-btn reset">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
    </div>
</div>


    <div id="teams" class="teams"></div>

    <div class="controls">
        <p>Active Team: <strong id="activeName">-</strong></p>
        <button class="score-btn" onclick="addScore(10)">+10</button>
        <button class="score-btn" onclick="addScore(5)">+5</button>
        <button class="score-btn" onclick="passQuestion()">Pass ➜</button>
        <button class="score-btn" onclick="nextTurn()">Next ⏭</button>
    </div>

    <section class="history">
        <h3>Records</h3>
        <ul id="historyList"></ul>
    </section>
</main>
<audio id="bell" preload="auto">
    <source src="https://cdn.freesound.org/previews/219/219244_4082831-lq.mp3" type="audio/mpeg">
</audio>



<script src="script.js"></script>
</body>
</html>
