<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Quiz Scoreboard</title>
  <link rel="stylesheet" href="style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3893797924350985"
     crossorigin="anonymous"></script>
</head>
<body>

<button id="menuBtn" title="Open Settings">☰ Settings</button>
<button id="fullscreenBtn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">⛶</button>

<aside id="sidebar">
  <div class="sidebar-header">
    <h2>Game Settings</h2>
  </div>
  
  <div class="field-group">
    <label for="roundInput">Round Name</label>
    <input id="roundInput" placeholder="e.g. Science / Rapid Fire">
  </div>

  <div class="field-group">
    <label for="teamCount">Number of Teams</label>
    <select id="teamCount">
      <option value="2">2 Teams</option>
      <option value="3">3 Teams</option>
      <option value="4" selected>4 Teams</option>
      <option value="5">5 Teams</option>
      <option value="6">6 Teams</option>
      <option value="7">7 Teams</option>
      <option value="8">8 Teams</option>
    </select>
  </div>

  <div class="field-group">
    <label>Edit Team Names</label>
    <div id="teamNames" class="team-names-list"></div>
  </div>

  <hr>

  <div class="sidebar-section">
    <h3>🎰 Gambling Round</h3>
    <div class="gamble-controls">
      <input type="number" id="gambleAmount" placeholder="Points (e.g. 20)">
      <div class="row">
        <button class="btn-success" onclick="gamble(true)">Win</button>
        <button class="btn-danger-outline" onclick="gamble(false)">Lose</button>
      </div>
    </div>
  </div>

  <hr>

  <div class="sidebar-actions">
    <button class="warning-btn" onclick="clearHistory()">🗑️ Clear Records</button>
    <button class="danger" onclick="resetAll()">⚠️ Reset Entire Game</button>
  </div>
</aside>

<main class="app">
  <header class="app-header">
    <h1>Smart Quiz Scoreboard</h1>
    <span id="roundTitle" class="round-badge">Round: -</span>
  </header>

  <section class="timer-section">
    <div class="timer-ring">
      <svg class="progress-ring" width="140" height="140">
        <circle class="progress-ring__circle" stroke="var(--accent-cyan)" stroke-width="6" fill="transparent" r="64" cx="70" cy="70"/>
      </svg>
      <div class="timer-display">
        <span id="time" aria-live="assertive">30</span><small>s</small>
      </div>
    </div>
    <div class="timer-btns">
      <button onclick="toggleTimer()" id="playPauseBtn" class="icon-btn primary" title="Play/Pause">
        <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <svg id="pauseIcon" style="display:none" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
      </button>
      
      <button onclick="resetTimer()" class="icon-btn" title="Reset Timer">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      </button>
    </div>
  </section>

  <section id="teams" class="teams"></section>

  <section class="controls-panel">
    <div class="active-team-indicator">
      <span>Turn:</span>
      <strong id="activeName" aria-live="polite">-</strong>
    </div>
    <div class="action-buttons">
      <button class="score-btn add-10" onclick="addScore(10)">+10</button>
      <button class="score-btn add-5" onclick="addScore(5)">+5</button>
      <button class="score-btn pass" onclick="passQuestion()">Pass ➜</button>
      <button class="score-btn next" onclick="nextTurn()">Next Turn ⏭</button>
      <button class="score-btn undo" id="undoBtn" onclick="undo()" title="Undo last action (Ctrl+Z)">↩ Undo</button>
    </div>
  </section>

  <section class="history">
    <h3>Activity Log</h3>
    <ul id="historyList"></ul>
  </section>
</main>

<audio id="bell" preload="auto">
  <source src="https://cdn.freesound.org/previews/219/219244_4082831-lq.mp3" type="audio/mpeg">
</audio>
<audio id="tick" preload="auto">
  <source src="https://cdn.freesound.org/previews/256/256173_3263906-lq.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
